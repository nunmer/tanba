services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tanba
      POSTGRES_PASSWORD: tanba
      POSTGRES_DB: tanba
    ports:
      - "5433:5432"   # 5433 on host to avoid clashing with a native Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanba -d tanba"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
